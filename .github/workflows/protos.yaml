name: generated-protos

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  generated-protos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1

      - name: Cache protobuf generators
        id: proto-tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/bd-proto-tools
          key: proto-tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/proto-tools.env') }}

      - name: Install protobuf generators
        if: steps.proto-tools.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/install-proto-tools.sh --directory "$HOME/.cache/bd-proto-tools"

      - name: Check generated bindings
        shell: bash
        run: |
          tool_dir="$HOME/.cache/bd-proto-tools"
          export PATH="$tool_dir/bin:$tool_dir/protoc/bin:$PATH"
          echo "$tool_dir/bin" >> "$GITHUB_PATH"
          echo "$tool_dir/protoc/bin" >> "$GITHUB_PATH"
          make check-protos
