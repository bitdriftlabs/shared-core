name: on-demand benchmark

on:
  issue_comment:
    types: [created]

# The benchmark executes pull-request code, so keep its workflow-level token read-only. The
# separate reporting job receives the write permissions needed to comment on the pull request.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: on-demand-benchmark-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    outputs:
      base_sha: ${{ steps.pr.outputs.base_sha }}
      benchmark: ${{ steps.benchmark.outputs.name }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      merge_base_sha: ${{ steps.pr.outputs.merge_base_sha }}
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/benchmark ') &&
      (github.event.comment.author_association == 'OWNER' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest-arm-16-cores
    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            core.setOutput('base_sha', pullRequest.base.sha);
            core.setOutput('head_sha', pullRequest.head.sha);

            const { data: comparison } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: pullRequest.base.sha,
              head: pullRequest.head.sha,
            });
            core.setOutput('merge_base_sha', comparison.merge_base_commit.sha);

      - name: Resolve benchmark
        id: benchmark
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          if [[ ! "$COMMAND" =~ ^/benchmark[[:space:]]+([a-z0-9-]+)[[:space:]]*$ ]]; then
            echo "Expected '/benchmark <name>'; received: $COMMAND" >&2
            exit 2
          fi

          case "${BASH_REMATCH[1]}" in
            workflows)
              # Criterion can retain the merge-base result as a baseline and compare HEAD to it.
              echo 'name=workflows' >> "$GITHUB_OUTPUT"
              echo 'command=./bd-workflow-bench/criterion.sh' >> "$GITHUB_OUTPUT"
              ;;
            json-path)
              echo 'name=json-path' >> "$GITHUB_OUTPUT"
              echo 'command=./bd-workflow-bench/json_path.sh' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown benchmark '${BASH_REMATCH[1]}'. Available benchmarks: workflows, json-path" >&2
              exit 2
              ;;
          esac

      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.pr.outputs.head_sha }}
          submodules: recursive

      - name: Verify revisions
        id: revisions
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          MERGE_BASE: ${{ steps.pr.outputs.merge_base_sha }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "$MERGE_BASE^{commit}"

      - name: Install benchmark dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes lld

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Benchmark merge base and head
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          MERGE_BASE: ${{ steps.pr.outputs.merge_base_sha }}
          BENCHMARK_COMMAND: ${{ steps.benchmark.outputs.command }}
        run: |
          set -euo pipefail

          git checkout --detach "$MERGE_BASE"
          git submodule update --init --recursive
          "$BENCHMARK_COMMAND" -- --save-baseline merge-base

          git checkout --detach "$HEAD_SHA"
          git submodule update --init --recursive
          "$BENCHMARK_COMMAND" -- --baseline merge-base

      - name: Upload Criterion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.benchmark.outputs.name }}-benchmark-pr-${{ github.event.issue.number }}
          path: target/criterion
          if-no-files-found: warn

  report:
    needs: benchmark
    if: always() && needs.benchmark.result != 'skipped'
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Criterion report
        if: needs.benchmark.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.benchmark.outputs.benchmark }}-benchmark-pr-${{ github.event.issue.number }}
          path: criterion

      - name: Report result
        uses: actions/github-script@v7
        env:
          BENCHMARK: ${{ needs.benchmark.outputs.benchmark }}
          BASE_SHA: ${{ needs.benchmark.outputs.base_sha }}
          HEAD_SHA: ${{ needs.benchmark.outputs.head_sha }}
          MERGE_BASE: ${{ needs.benchmark.outputs.merge_base_sha }}
          RESULT: ${{ needs.benchmark.result }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const marker = '<!-- shared-core-on-demand-benchmark -->';
            const result = process.env.RESULT === 'success' ? 'passed' : 'failed';
            const criterionSummary = () => {
              const estimates = [];
              const visit = (directory) => {
                for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                  const entryPath = path.join(directory, entry.name);
                  if (entry.isDirectory()) {
                    visit(entryPath);
                  } else if (entry.name === 'estimates.json' &&
                             path.basename(path.dirname(entryPath)) === 'change') {
                    estimates.push(entryPath);
                  }
                }
              };

              if (!fs.existsSync('criterion')) {
                return 'Criterion comparison results were unavailable.';
              }
              visit('criterion');

              const formatDuration = (nanoseconds) => {
                const units = [
                  [1e9, 's'],
                  [1e6, 'ms'],
                  [1e3, 'µs'],
                  [1, 'ns'],
                ];
                const [scale, unit] = units.find(([scale]) => Math.abs(nanoseconds) >= scale) ||
                  units[units.length - 1];
                return `${nanoseconds < 0 ? '-' : '+'}${(Math.abs(nanoseconds) / scale).toFixed(2)} ${unit}`;
              };

              const rows = estimates.flatMap((changePath) => {
                const benchmarkDirectory = path.dirname(path.dirname(changePath));
                const readMean = (directory) => JSON.parse(
                  fs.readFileSync(path.join(benchmarkDirectory, directory, 'estimates.json'), 'utf8'),
                ).mean?.point_estimate;
                const baselineMean = readMean('merge-base');
                const headMean = readMean('new');
                const relativeChange = readMean('change');
                if (![baselineMean, headMean, relativeChange].every(Number.isFinite)) {
                  return [];
                }

                const name = path.relative('criterion', benchmarkDirectory).replaceAll('|', '\\|');
                return [[name, formatDuration(headMean - baselineMean), relativeChange * 100]];
              }).sort(([left], [right]) => left.localeCompare(right));

              if (rows.length === 0) {
                return 'Criterion comparison results were unavailable.';
              }
              return `### Criterion mean change\n\n| Benchmark | Absolute | Percent |\n| --- | ---: | ---: |\n${rows.map(([name, absolute, percent]) =>
                `| \`${name}\` | ${absolute} | ${percent >= 0 ? '+' : ''}${percent.toFixed(2)}% |`,
              ).join('\n')}`;
            };
            const body = `${marker}
            ## Benchmark: \`${process.env.BENCHMARK || 'unknown'}\` ${result}

            Compared \`${process.env.HEAD_SHA || 'unavailable'}\` with merge base \`${process.env.MERGE_BASE || 'unavailable'}\` (PR base \`${process.env.BASE_SHA || 'unavailable'}\`).
            ${criterionSummary()}

            The Criterion HTML report is attached to this workflow run.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker),
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
